name: Bengali Shorts Generator

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg and Bengali Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget
          mkdir -p fonts
          wget -O fonts/NotoSansBengali-Regular.ttf "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansBengali/NotoSansBengali-Regular.ttf"

      - name: Run the script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python main.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts
          path: |
            script.txt
            voice.mp3
            short.mp4